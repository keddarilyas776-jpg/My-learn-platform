<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Blue rounded square background -->
  <rect width="64" height="64" rx="14" fill="#2563eb"/>
  <!-- Subtle inner gradient overlay -->
  <rect width="64" height="64" rx="14" fill="url(#grad)" opacity="0.4"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Mortarboard cap top (diamond/rhombus) -->
  <polygon points="32,12 54,22 32,32 10,22" fill="#ffffff"/>
  <!-- Cap body (cylinder front face) -->
  <path d="M16,25 L16,37 Q16,42 32,44 Q48,42 48,37 L48,25 Q40,29 32,32 Q24,29 16,25 Z" fill="#1d4ed8"/>
  <!-- Cap body highlight -->
  <path d="M16,25 Q24,29 32,32 Q40,29 48,25 L48,37 Q48,42 32,44 Q16,42 16,37 Z" fill="#1e40af"/>
  <!-- Tassel cord -->
  <line x1="48" y1="22" x2="48" y2="36" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Tassel knot -->
  <circle cx="48" cy="37.5" r="3" fill="#f59e0b"/>
  <!-- Tassel fringe -->
  <line x1="46" y1="40" x2="44.5" y2="46" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="48" y1="40.5" x2="48" y2="47" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="50" y1="40" x2="51.5" y2="46" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Small star/shine on cap top -->
  <circle cx="32" cy="22" r="2.2" fill="#bfdbfe" opacity="0.9"/>
</svg>